<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | APARC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body style="min-height: 100vh; display: grid; place-items: center; background: #eef5ef;">

  <main class="form-panel" style="width: min(430px, 92vw);">
    <div class="eyebrow">APARC RENACE CAÑETE</div>
    <h1 style="margin: 8px 0;">Panel administrativo</h1>
    <p style="color: var(--gris);">Ingresa para gestionar productos, consultas y solicitudes.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label>Usuario</label>
        <input name="usuario" required autocomplete="username">
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="contrasena" required autocomplete="current-password">
      </div>

      <button class="btn btn-primary" style="width: 100%;">Entrar al panel →</button>
    </form>
  </main>

</body>
</html>
